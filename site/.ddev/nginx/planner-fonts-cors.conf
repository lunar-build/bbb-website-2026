# The Cycle Planner (better-by-bike-cycle-planner.test) loads the theme's fonts cross-origin
# through /wp-json/bbb/v1/planner/styles. Trellis sends this header on staging/live
# (h5bp cross_domain_fonts); this does the same locally for built (non-HMR) assets.
location ~* \.(?:ttf|otf|woff2?|eot)$ {
    add_header Access-Control-Allow-Origin "*";
    try_files $uri =404;
}
